{% extends "base.html" %}
{% block title %}Add Customer{% endblock %}
{% block page_title %}Add Customer{% endblock %}

{% block content %}
<div class="section-title" style="margin-top:0;">
  <div><span class="eyebrow">Accounts</span><h2>New customer</h2></div>
</div>

<div class="panel-card" style="max-width:480px;">
  <form method="POST">
    <div style="margin-bottom:14px;">
      <label style="font-size:12px; color:var(--slate-600); display:block; margin-bottom:5px;">Full Name</label>
      <input type="text" name="name" required style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);">
    </div>
    <div style="margin-bottom:14px;">
      <label style="font-size:12px; color:var(--slate-600); display:block; margin-bottom:5px;">Phone Number</label>
      <input type="text" name="phone" required style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);">
    </div>
    <div style="margin-bottom:14px;">
      <label style="font-size:12px; color:var(--slate-600); display:block; margin-bottom:5px;">Address (optional)</label>
      <input type="text" name="address" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);">
    </div>
    <div style="margin-bottom:18px;">
      <label style="font-size:12px; color:var(--slate-600); display:block; margin-bottom:5px;">Notes (optional)</label>
      <textarea name="notes" rows="3" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit;"></textarea>
    </div>
    <button class="btn btn-accent" style="width:100%;">Add Customer</button>
  </form>
</div>
{% endblock %}
